<script>
'use strict';
const DT=1/120, G=20, MIN_L=1.7, MAX_L=4.5, GRAB=4.8, CH=22, ORIGIN=3.15, VIEW_H=12.2, LAVA0=-0.55;
const TAU=Math.PI*2;
const INTRO=[[0.15,6.35,'white'],[-1.05,8.15,'white'],[1.2,9.95,'white'],[-1.4,11.7,'white'],[1.55,13.5,'white'],[-1.35,15.25,'white']];
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let fx=reduced?1:2, ema=16, frames=0;
let actx=null, master=null, bed=null, bedGain=null, soundOn=true, audioUnlocked=false;
let seed=1, dayNum=0, isDaily=true, phase='attract', tick=0, simT=0, lava=LAVA0;
let wantHold=false, liveHeld=false, dashQueue=null, downAt=0, lastUpAt=-9999, lastDur=999, lastX=0, lastY=0, suppressUp=false;
let preGrab=null, camX=1.15, camY=4.2, camReady=false, shake=0, closeCd=0, scaleT=0;
let hitStop=0, grabPulse=0, relPulse=0, whooshGain=null, whooshF=null;
const cape=Array.from({length:6},()=>({x:0,y:0,on:0}));
let autoplay=false, houseOn=false, headM=0, paused=false, sheetOpen=false;
let lastT=0, acc=0, revealT=0, deathAt=0, deathGen=0, frozen=null, pbThis=false, bestAtStart=0;
let rival=null, lastCode='', exportToken=0, clipBlob=null, clipBusy=false;
let taught={}, streak={last:'',n:0}, originScore=0;
const log=[]; let player=null, ghost=null;
const chunkCache=new Map(), idMap=new Map(), ends=new Map(), builtN=new Map();
const nearA=[], nearS=[];
const RING=240; const ring=new Array(RING); let ringI=0, ringN=0;
const parts=Array.from({length:180},()=>({on:0})); let pScan=0;
let noiseCanvas=null, glowW=null, glowG=null, glowE=null, vignette=null, vigW=0, vigH=0;
let brokenArr=[];
let bands=[], bandMark=-1, hadClose=false, hadPB=false, runClose=false;
let manual=false, toastT=0;
const FONT='"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif';

function clamp(v,a,b){return v<a?a:v>b?b:v}
function mix(a,i){let x=Math.imul(a^0x9E3779B9,0x85EBCA6B)^Math.imul((i|0)+1,0xC2B2AE35);x=Math.imul(x^(x>>>13),0x5BD1E995);return (x^(x>>>16))>>>0||1}

function utcDay(ms){const d=new Date(ms==null?Date.now():ms);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function dayNumber(ms){const d=new Date(ms==null?Date.now():ms);const day=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());return Math.floor((day-Date.UTC(2026,0,1))/86400000)+1}
function dailySeed(n){return mix(0xA11CE, n)%1000000000||1}
function scoreOf(y){return Math.max(0, Math.floor(y-ORIGIN))}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,obj){const s=typeof obj==='string'?obj:JSON.stringify(obj);try{localStorage.setItem(k,s);return true}catch(e){try{const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf('us:v1:lb')===0)keys.push(key)}keys.forEach(key=>localStorage.removeItem(key));localStorage.setItem(k,s);return true}catch(e2){return false}}}
function loadMeta(){soundOn=lsGet('us:v1:sound');if(soundOn==null)soundOn=true;taught=lsGet('us:v1:taught')||{};streak=lsGet('us:v1:streak')||{last:'',n:0};headM=+lsGet('us:v1:head')||0;if(![0,5,10,20,30].includes(headM))headM=0;houseOn=!!lsGet('us:v1:houseOn')}
function bestKey(){return 'us:v1:best:'+seed}
function currentBest(){const b=lsGet(bestKey());return b&&b.s?b.s:0}

function makeA(ci,n,x,y,type,rnd,main){return {id:ci*16+n+1,x,y,type,phase:(rnd||0)*TAU,amp:type==='moving'?1.05+(rnd||0)*1.25:0,main:main?1:0}}
function pressure(y){
  if(y<16)return 0.08;
  const cyc=(y-16)%56;
  if(cyc<18)return 0.2+cyc/18*0.15;
  if(cyc<42)return 0.4+(cyc-18)/24*0.6;
  return 0.85-(cyc-42)/14*0.45;
}
function opening(b){if(!b)return 0;return clamp(1-Math.max(0,(b.maxY||b.y||0)-ORIGIN)/14,0,1)}
function buzz(pat){try{if(navigator.vibrate)navigator.vibrate(pat)}catch(e){}}
function setClipLabel(t){const b=document.getElementById('btnClip');if(b)b.textContent=t}
function ensure(sd,i){let n=builtN.get(sd)||0;while(n<=i){buildChunk(sd,n);n++}builtN.set(sd,n)}
function buildChunk(sd,i){
  const anchors=[],spikes=[];
  const endY=(i+1)*CH;
  const endsArr=ends.get(sd)||(ends.set(sd,[]),ends.get(sd));
  let x,y,side,n=0;
  if(i===0){
    INTRO.forEach((s,k)=>anchors.push(makeA(0,k,s[0],s[1],s[2],0.2+k*0.1,1)));
    anchors.push(makeA(0,6,-2.65,10.7,'gold',0.4,0));
    const last=anchors[INTRO.length-1];
    endsArr[0]={x:last.x,y:last.y,side:last.x>0?-1:1};
  }else{
    const p=endsArr[i-1];
    x=p.x;y=p.y;side=p.side||((i%2)?-1:1);
    const rng=mulberry32(mix(sd,i+1));
    const base=i*CH;
    while(y<endY-0.4&&n<8){
      const pr=pressure(y);
      let dx=(1.25+rng()*(0.55+pr*0.95))*side;
      let dy=1.32+rng()*(0.28+pr*0.62);
      let dist=Math.hypot(dx,dy);
      if(dist>3.35){dx*=3.2/dist;dy*=3.2/dist}
      if(dist<2.05){dx*=2.15/Math.max(0.2,dist);dy*=2.15/Math.max(0.2,dist)}
      const x2=clamp(x+dx,-4.7,4.7);
      dx=x2-x; dist=Math.hypot(dx,dy);
      if(dist>3.45){dy*=(3.3/dist);dx*=(3.3/dist)}
      const ny=y+dy;
      if(ny>=endY+0.6&&n>0)break;
      y=ny; x=x+dx; side*=-1; 
      let type='white'; const roll=rng();
      if(y>22&&pr<0.48&&roll>0.78)type='gold';
      else if(y>40&&pr>0.45&&roll>0.62)type='crumble';
      else if(y>70&&pr>0.55&&roll>0.5)type='moving';
      const a=makeA(i,n,x,y,type,rng(),1); anchors.push(a); n++;
      if(y>30&&pr<0.55&&rng()>0.62&&n<8){
        const gx=clamp(x+side*2.55,-5.3,5.3);
        anchors.push(makeA(i,n,gx,y+1.55,'gold',rng(),0)); n++;
      }
      if(y>58&&pr>0.5&&rng()>0.78){
        spikes.push({x:clamp(x-side*2.15,-5.4,5.4),y:y-1.35,r:0.52});
      }
    }
    endsArr[i]={x,y,side};
  }
  anchors.forEach(a=>idMap.set(sd+':'+a.id,a));
  chunkCache.set(sd+':'+i,{anchors,spikes});
}
function aById(sd,id){return idMap.get(sd+':'+id)||null}
function apos(a,t){if(!a)return null;if(a.type!=='moving')return {x:a.x,y:a.y};return {x:a.x+Math.sin(t*0.82+a.phase)*a.amp,y:a.y}}
function collect(sd,y0,y1){
  nearA.length=0;nearS.length=0;
  const i0=Math.max(0,Math.floor(y0/CH)-1), i1=Math.max(0,Math.floor(y1/CH)+1);
  ensure(sd,i1);
  for(let i=i0;i<=i1;i++){
    const c=chunkCache.get(sd+':'+i); if(!c)continue;
    for(const a of c.anchors) if(a.y>=y0&&a.y<=y1) nearA.push(a);
    for(const s of c.spikes) if(s.y>=y0&&s.y<=y1) nearS.push(s);
  }
}
function makeBody(){return {x:0,y:2,vx:0,vy:0,state:'air',held:false,prevHeld:false,arm:0,aid:0,aType:'',L:0,th:0,om:0,combo:0,grabY:0,dash:1,lock:0,hang:0,maxY:2,dead:false,broken:new Set(),ei:0,trail:[],evGrab:0,evRel:0,evDash:0,evClose:0,evPerfect:0,evBonk:0,evGold:0,reelT:0,skim:0,cool:0,forbid:0,ready:0,safety:2}}
function capOm(b){const max=22+Math.min(6,b.combo*0.35);const sp=Math.abs(b.om)*b.L;if(sp>max)b.om=Math.sign(b.om||1)*max/b.L}
function capV(b,m){const sp=Math.hypot(b.vx,b.vy);if(sp>m){const k=m/sp;b.vx*=k;b.vy*=k}}
function pickAnchor(b,t){
  const o=opening(b);
  collect(seed,b.y-2,b.y+8+o*2);
  let best=null,bs=1e9; const sp=Math.hypot(b.vx,b.vy);
  const fxn=sp>1.6?b.vx/sp:0, fyn=sp>1.6?b.vy/sp:1;
  const reach=GRAB+o*1.8, dyMin=o>0.35?0.15:1, dMin=o>0.35?0.78:1.25;
  for(const a of nearA){
    if(b.broken.has(a.id)||a.id===b.aid)continue;
    if(b.cool>0&&a.id===b.forbid)continue;
    const ap=apos(a,t); const dx=ap.x-b.x, dy=ap.y-b.y; const d=Math.hypot(dx,dy);
    if(d<dMin||d>reach||dy<dyMin)continue;
    const dot=(dx/d)*fxn+(dy/d)*fyn;
    if(sp>4&&dot<-0.15-o*0.35)continue;
    const s=d+(1-dot)*1.05+(a.type==='crumble'?0.5:0)+(a.main?0:1.2);
    if(s<bs){bs=s;best=a}
  }
  return best;
}
function tryGrab(b,t){
  const a=pickAnchor(b,t); if(!a)return false;
  const ap=apos(a,t); const dist=Math.hypot(b.x-ap.x,b.y-ap.y);
  const oGrab=opening(b);
  if(dist<(oGrab>0.35?0.72:1.3))return false;
  const L=clamp(Math.max(dist,MIN_L),MIN_L,MAX_L);
  const th=Math.atan2(b.x-ap.x, ap.y-b.y);
  b.x=ap.x+Math.sin(th)*L; b.y=ap.y-Math.cos(th)*L;
  const tx=Math.cos(th), ty=Math.sin(th);
  let om=(b.vx*tx+b.vy*ty)/L;
  const sp=Math.hypot(b.vx,b.vy);
  const o=opening(b);
  if(sp>4&&Math.abs(om)*L<3.2){
    const side=Math.abs(b.vx)>0.8?Math.sign(b.vx):(th>=0?-1:1);
    om=side*Math.min(8.2, Math.max(4.0, sp*0.36))/L;
  }else if(Math.abs(om)*L<2.6){
    const side=th>=0?-1:1;
    om=side*(2.15+o*1.35)/L;
  }
  b.om=om*(1+0.04*Math.min(b.combo,8));
  b.th=th; b.L=L; b.L0=L; b.catchT=0.1; b.ready=0; b.aid=a.id; b.aType=a.type; b.state='swing';
  b.combo++; b.dash=1; b.grabY=b.y; b.hang=0; b.evGrab=1;
  if(a.type==='gold')b.evGold=1;
  capOm(b); return true;
}
function aimAnchor(b,t){
  const o=opening(b);
  collect(seed,b.y-1.5,b.y+10);
  let best=null,bs=1e9;
  for(const a of nearA){
    if(a.id===b.aid||b.broken.has(a.id))continue;
    const ap=apos(a,t); const dx=ap.x-b.x, dy=ap.y-b.y;
    if(dy<1-o*0.55)continue;
    const d=Math.hypot(dx,dy);
    if(d<1.05||d>GRAB+0.8+o*1.6)continue;
    const s=d+(a.main?0:0.7);
    if(s<bs){bs=s;best=a}
  }
  return best;
}
function release(b,whip){
  if(b.state!=='swing'){b.state='air';return}
  const o=opening(b);
  b.forbid=b.aid; b.cool=whip?Math.max(0.05,0.14-o*0.08):0.2;
  if(whip){
    let sp=Math.hypot(b.vx,b.vy)||1;
    let boost=1.14+Math.min(0.26, Math.max(0,b.vy)*0.022)+o*0.05;
    if(b.aType==='gold')boost*=1.28;
    const ang=Math.atan2(b.vx, Math.max(0.001,b.vy));
    if(b.vy>6.1&&Math.abs(ang)<0.78){boost*=1.08; b.evPerfect=1}
    const tgt=aimAnchor(b,simT);
    if(tgt){
      const ap=apos(tgt,simT);
      const dx=ap.x-b.x, dy=ap.y-b.y, d=Math.hypot(dx,dy)||1;
      const dot=(b.vx*dx+b.vy*dy)/(sp*d);
      const steer=0.3+o*0.28;
      if(dot>0.12-o*0.4){
        const tx=dx/d, ty=dy/d;
        b.vx=(b.vx/sp)*(1-steer)*sp*boost + tx*sp*boost*steer;
        b.vy=(b.vy/sp)*(1-steer)*sp*boost + ty*sp*boost*steer;
      }else{
        b.vx*=boost; b.vy*=boost;
      }
      if(o>0.35){
        const add=(2.4+o*2.4)*o;
        b.vx+=(dx/d)*add*0.55; b.vy+=(dy/d)*add;
      }
    }else{
      b.vx*=boost; b.vy*=boost;
      if(o>0.45)b.vy+=5.5*o;
    }
    if(o>0.4){
      const up=6.4+o*3;
      if(b.vy<up)b.vy=b.vy*0.4+up*0.6;
      b.vx*=0.78;
    }
    capV(b,30); b.evRel=1;
  }
  b.state='air'; b.aid=0;
}
function tryDash(b,q){
  if(!b.dash||b.state!=='air'||b.dead)return;
  const a=q*(Math.PI/4); const dx=Math.cos(a), dy=Math.sin(a);
  b.vx+=dx*11.5; b.vy+=dy*13.2; b.dash=0; b.evDash=1; capV(b,33);
}
function handleHold(b,t){
  if(b.saveGrace>0)b.saveGrace-=DT;
  if(b.held&&!b.prevHeld){b.arm=1;b.queueRel=0}
  if(!b.held){
    if(b.state==='swing'&&!(b.saveGrace>0)){
      const o=opening(b);
      if(o>0.5&&b.combo<=1&&(!b.ready||b.vy<0.6))b.queueRel=1;
      else release(b,true);
    }
    b.arm=0;
  }else if(b.queueRel&&b.state==='swing'&&b.ready){
    b.queueRel=0; release(b,true);
  }
  b.prevHeld=b.held;
  if(b.arm&&b.state==='air'&&b.lock<=0){if(tryGrab(b,t))b.arm=0}
}
function stepAir(b){
  b.vy-=G*DT;
  const drag=Math.exp(-0.11*DT);
  b.vx*=drag; b.vy*=drag;

  for(let i=1;i<cape.length;i++){
    const p=cape[i], q=cape[i-1];

function updateCamera(s,dt){

function startClip(){
  const btn=document.getElementById('btnClip');
  if(!canClip||clipBusy||phase!=='dead')return;
  const mime=pickMime(); if(!mime){if(btn)btn.hidden=true;setClipLabel('CLIP');return}
  const frames=ringOrdered(); if(frames.length<2){toast('NO CLIP');setClipLabel('CLIP');return}
  clipBusy=true; clipBlob=null; const token=exportToken; setClipLabel('SAVING');
  const tmp=document.createElement('canvas'); tmp.width=720; tmp.height=1280; const g=tmp.getContext('2d');
  let stream; try{stream=tmp.captureStream(30)}catch(e){clipBusy=false;setClipLabel('CLIP');if(btn)btn.hidden=true;return}
  let rec; try{rec=new MediaRecorder(stream,{mimeType:mime})}catch(e){clipBusy=false;setClipLabel('CLIP');if(btn)btn.hidden=true;return}
  const chunks=[]; rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const stopped=new Promise(r=>{rec.onstop=()=>r();rec.onerror=()=>r()});
  rec.start(100);
  const playMs=frames.length/60*1000;
  const holdMs=1100;
  const t0=performance.now();
  function pump(){
    if(token!==exportToken){try{rec.stop()}catch(e){}stream.getTracks().forEach(t=>t.stop());clipBusy=false;setClipLabel('CLIP');return}
    const elapsed=performance.now()-t0;
    if(elapsed<playMs){
      let idx=elapsed/ (playMs/frames.length);
      const base=frames[Math.min(frames.length-1,Math.floor(idx))];
      const prev=frames[Math.max(0,Math.min(frames.length-1,Math.floor(idx)-1))];
      const slow=base&&base.close?0.45:1;
      idx=Math.min(frames.length-1, idx);
      const s=frames[Math.min(frames.length-1,Math.floor(idx*slow+(1-slow)*Math.max(0,idx-8)))];
      paintExport(g,s||base,0);
    }else if(elapsed<playMs+holdMs){
      paintExport(g,frames[frames.length-1],(elapsed-playMs)/holdMs);
    }else{
      try{rec.stop()}catch(e){}
      stopped.then(()=>{stream.getTracks().forEach(t=>t.stop());if(token!==exportToken){clipBusy=false;setClipLabel('CLIP');return}clipBlob=new Blob(chunks,{type:mime.split(';')[0]});clipBusy=false;setClipLabel('SAVE CLIP')});
      return;
    }
    requestAnimationFrame(pump);
  }
  paintExport(g,frames[0],0);
  requestAnimationFrame(pump);
}

  // place uses global seed
  const prevPlayer=player; player=body;
  place(body,head||0);
  player=prevPlayer;
  let t=0, lv=LAVA0, hold=false, ei=0, steps=0;
  const samples=[];
  body.held=false; body.prevHeld=false;
  for(let tk=0;tk<maxTicks;tk++){
    while(ei<events.length&&events[ei].t<=tk){const e=events[ei++];if(e.k===1)body.held=true;else if(e.k===2)body.held=false;else if(e.k===3)tryDash(body,e.dir|0)}
    const ps=seed; seed=sd; const pt=simT; simT=t; const pl=lava; lava=lv;
    stepBody(body,t);
    seed=ps; simT=pt; lava=pl;
    t+=DT; lv+=lavaSpeed(t)*DT; steps++;
    if(!Number.isFinite(body.y)){
      seed=saved.seed; lava=saved.lava; simT=saved.simT; tick=saved.tick; player=saved.player; ghost=saved.ghost; phase=saved.phase;
      return {ok:false,y:body.y,steps};
    }
    if(body.dead)break;
    if(tk%30===0)samples.push(+body.y.toFixed(3));
  }
  seed=saved.seed; lava=saved.lava; simT=saved.simT; tick=saved.tick; player=saved.player; ghost=saved.ghost; phase=saved.phase;
  return {ok:Number.isFinite(body.y),y:+body.maxY.toFixed(3),steps,samples,score:scoreOf(body.maxY),dead:body.dead};
}
function soakAI(sd,maxTicks){
  const saved={seed,lava,simT,tick,player,ghost,phase};
  seed=sd; ensure(sd,8);
  const body=makeBody(); body.broken=new Set();
  place(body,0);
  let t=0, lv=LAVA0;
  for(let tk=0;tk<maxTicks&&!body.dead;tk++){
    seed=sd; simT=t; lava=lv;
    const w=aiWant(body);
    body.held=!!w.hold;
    if(w.dash!=null)tryDash(body,w.dash);
    stepBody(body,t);
    t+=DT; lv+=lavaSpeed(t)*DT;
  }
  const out={score:scoreOf(body.maxY),dead:!!body.dead,y:+body.maxY.toFixed(3)};
  seed=saved.seed; lava=saved.lava; simT=saved.simT; tick=saved.tick; player=saved.player; ghost=saved.ghost; phase=saved.phase;
  return out;
}
function runQA(){
  const report=[];
  const check=(n,c,extra)=>report.push({name:n,ok:!!c,extra:extra==null?'':String(extra)});
  check('bad ghost', decodeRun('@@@')===null);
  check('bad empty', decodeRun('')===null);
  check('seed fallback type', Number.isFinite(Number('foo'))===false);
  const ev=[]; for(let t=0;t<1200;t+=90){ev.push({t,k:1});ev.push({t:t+60,k:2})}
  // roundtrip
  log.length=0; ev.forEach(e=>log.push(e)); player=makeBody(); player.maxY=40; const code=encodeRun(); const back=decodeRun(code);
  check('roundtrip', back&&back.events.length===ev.length&&back.seed===seed, back&&back.events.length);
  const a=simulate(seed,ev,0,600); const b=simulate(seed,ev,0,600);
  check('deterministic', a.ok&&b.ok&&a.y===b.y&&a.samples.join()===b.samples.join(), a.y+' / '+b.y);
  const soak=soakAI(7,120*16); const soakB=soakAI(7,120*16);
  check('script climbs', soak.score>=12, 'score '+soak.score+' y '+soak.y+' dead '+soak.dead);
  check('ai stable', soak.score===soakB.score, soak.score+'/'+soakB.score);
  ensure(seed,25); let gapOk=true,worst=0,minG=99,prev=null;
  for(let i=0;i<=25;i++){const c=chunkCache.get(seed+':'+i);for(const an of c.anchors){if(!an.main)continue;if(prev){const d=Math.hypot(an.x-prev.x,an.y-prev.y);if(d>worst)worst=d;if(d<minG)minG=d;if(d>4.0||d<1.75)gapOk=false}prev=an}}
  check('path gaps', gapOk&&worst<4.05&&minG>1.7, 'worst '+worst.toFixed(2)+' min '+(minG>90?'none':minG.toFixed(2)));
  const longEv=[]; for(let t=0;t<120*25;t+=80){longEv.push({t,k:1});longEv.push({t:t+50,k:2})}
  const long=simulate(dailySeed(293),longEv,0,120*25);
  check('long finite', long.ok, 'y '+long.y+' score '+long.score);
  const realSet=localStorage.setItem.bind(localStorage);
  let threw=false;
  localStorage.setItem=()=>{threw=true;throw new Error('full')};
  let survived=true; try{lsSet('us:v1:qa',{a:1})}catch(e){survived=false}
  localStorage.setItem=realSet;
  check('storage full', survived&&threw, survived);
  // rapid restart state
  resetRun(false); const t1=tick; resetRun(false); check('restart', phase==='run'&&tick===0&&player&&!player.dead);
  window.__QA__=report;
  return report;
}

for(let i=0;i<14;i++)emit(-3.2+i*0.5,LAVA0+0.12+(i%3)*0.06,1,{sp:0.25,life:0.7+(i%4)*0.12,r:0.07,vy:0.9+(i%3)*0.35,col:i%2?'#ffd7a8':'#ff6a2a',kind:'ember'});

  hold(v){wantHold=!!v},
  step(n){for(let i=0;i<n;i++){if(phase!=='run')break;stepWorld();burstFromPlayer()}},
  reset(o){if(o&&o.seed){seed=o.seed;isDaily=false;dayNum=0;ensure(seed,2)}resetRun(false);if(o&&o.hold)wantHold=true},
  kill(){if(player){player.y=lava-1;player.dead=true;die()}},
  decode:decodeRun, encode:encodeRun, simulate,
  soak(sd,n){return soakAI(sd||seed, n||120*12)},

  setManual(v){manual=!!v;acc=0}
};
