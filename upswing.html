<script>

let autoplay=false, houseOn=false, headM=0, paused=false, sheetOpen=false;
let lastT=0, acc=0, revealT=0, deathAt=0, deathGen=0, frozen=null, pbThis=false, bestAtStart=0;
let rival=null, lastCode='', exportToken=0, clipBlob=null, clipBusy=false;
let taught={}, streak={last:'',n:0}, originScore=0;
const log=[]; let player=null, ghost=null;

const parts=Array.from({length:180},()=>({on:0})); let pScan=0;
let noiseCanvas=null, glowW=null, glowG=null, glowE=null, vignette=null, vigW=0, vigH=0;
let brokenArr=[];
let bands=[], bandMark=-1, hadClose=false, hadPB=false, runClose=false;

const FONT='"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif';

function clamp(v,a,b){return v<a?a:v>b?b:v}
function mix(a,i){let x=Math.imul(a^0x9E3779B9,0x85EBCA6B)^Math.imul((i|0)+1,0xC2B2AE35);x=Math.imul(x^(x>>>13),0x5BD1E995);return (x^(x>>>16))>>>0||1}

function utcDay(ms){const d=new Date(ms==null?Date.now():ms);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function dayNumber(ms){const d=new Date(ms==null?Date.now():ms);const day=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());return Math.floor((day-Date.UTC(2026,0,1))/86400000)+1}
function dailySeed(n){return mix(0xA11CE, n)%1000000000||1}
function scoreOf(y){return Math.max(0, Math.floor(y-ORIGIN))}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,obj){const s=typeof obj==='string'?obj:JSON.stringify(obj);try{localStorage.setItem(k,s);return true}catch(e){try{const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf('us:v1:lb')===0)keys.push(key)}keys.forEach(key=>localStorage.removeItem(key));localStorage.setItem(k,s);return true}catch(e2){return false}}}
function loadMeta(){soundOn=lsGet('us:v1:sound');if(soundOn==null)soundOn=true;taught=lsGet('us:v1:taught')||{};streak=lsGet('us:v1:streak')||{last:'',n:0};headM=+lsGet('us:v1:head')||0;if(![0,5,10,20,30].includes(headM))headM=0;houseOn=!!lsGet('us:v1:houseOn');skinIdx=+lsGet('us:v1:skin')||0;if(skinIdx<0||skinIdx>=SKINS.length)skinIdx=0}
function bestKey(){return 'us:v1:best:'+seed}
function currentBest(){const b=lsGet(bestKey());return b&&b.s?b.s:0}

function makeA(ci,n,x,y,type,rnd,main){return {id:ci*16+n+1,x,y,type,phase:(rnd||0)*TAU,amp:type==='moving'?1.05+(rnd||0)*1.25:0,main:main?1:0}}
function pressure(y){
  if(y<22)return 0;
  if(y<40)return (y-22)/18*0.36;
  if(y<62)return 0.36+(y-40)/22*0.64;
  const cyc=(y-62)%42;
  if(cyc<18)return 0.86+cyc/18*0.14;
  return 1-(cyc-18)/24*0.28;
}
function opening(b){if(!b)return 0;return clamp(1-Math.max(0,(b.maxY||b.y||0)-ORIGIN)/18,0,1)}
function swingTiming(b){
  const rise=clamp((b.vy||0)/8,0,1);
  const arc=clamp((Math.abs(b.th||0)-0.22)/0.8,0,1);
  return clamp(rise*0.72+arc*0.28,0,1)*(b.ready?1:0.45);
}
function buzz(pat){try{if(navigator.vibrate)navigator.vibrate(pat)}catch(e){}}
function setClipLabel(t){const b=document.getElementById('btnClip');if(b)b.textContent=t}
function ensure(sd,i){let n=builtN.get(sd)||0;while(n<=i){buildChunk(sd,n);n++}builtN.set(sd,n)}
function buildChunk(sd,i){
  const anchors=[],spikes=[];
  const endY=(i+1)*CH;
  const endsArr=ends.get(sd)||(ends.set(sd,[]),ends.get(sd));
  let x,y,side,n=0;
  if(i===0){
    INTRO.forEach((s,k)=>anchors.push(makeA(0,k,s[0],s[1],s[2],0.2+k*0.1,1)));
    const last=anchors[INTRO.length-1];
    endsArr[0]={x:last.x,y:last.y,side:last.x>0?-1:1};
  }else{
    const p=endsArr[i-1];
    x=p.x;y=p.y;side=p.side||((i%2)?-1:1);
    const rng=mulberry32(mix(sd,i+1));
    const base=i*CH;
    while(y<endY-0.4&&n<8){
      const pr=pressure(y);
      const reach=2.08+pr*1.2;
      let dx=(reach*0.58*(0.86+rng()*0.28))*side;
      let dy=reach*0.8*(0.9+rng()*0.18);
      let dist=Math.hypot(dx,dy)||1;
      const want=Math.min(3.65, reach*(0.94+rng()*0.1));
      dx*=want/dist; dy*=want/dist; dist=want;
      if(dist<2.0){dx*=2.02/dist;dy*=2.02/dist}
      const x2=clamp(x+dx,-4.7,4.7);
      dx=x2-x; dist=Math.hypot(dx,dy);
      if(dist>3.9){dy*=3.72/dist;dx*=3.72/dist}
      if(dist<1.92){dx*=2.0/Math.max(0.2,dist);dy*=2.0/Math.max(0.2,dist)}
      const ny=y+dy;
      if(ny>=endY+0.6&&n>0)break;
      y=ny; x=x+dx; side*=-1; 
      const a=makeA(i,n,x,y,'white',rng(),1); anchors.push(a); n++;
    }
    endsArr[i]={x,y,side};
  }
  anchors.forEach(a=>idMap.set(sd+':'+a.id,a));

}
function aById(sd,id){return idMap.get(sd+':'+id)||null}
function apos(a,t){if(!a)return null;if(a.type!=='moving')return {x:a.x,y:a.y};return {x:a.x+Math.sin(t*0.82+a.phase)*a.amp,y:a.y}}
function collect(sd,y0,y1){
  nearA.length=0;nearS.length=0;
  const i0=Math.max(0,Math.floor(y0/CH)-1), i1=Math.max(0,Math.floor(y1/CH)+1);
  ensure(sd,i1);
  for(let i=i0;i<=i1;i++){
    const c=chunkCache.get(sd+':'+i); if(!c)continue;
    for(const a of c.anchors) if(a.y>=y0&&a.y<=y1) nearA.push(a);
    for(const s of c.spikes) if(s.y>=y0&&s.y<=y1) nearS.push(s);
  }
}
function makeBody(){return {x:0,y:2,vx:0,vy:0,state:'air',held:false,prevHeld:false,arm:0,aid:0,aType:'',L:0,th:0,om:0,combo:0,grabY:0,dash:1,lock:0,hang:0,maxY:2,dead:false,broken:new Set(),ei:0,trail:[],evGrab:0,evRel:0,evDash:0,evClose:0,evPerfect:0,evBonk:0,evGold:0,evPass:0,wasAhead:0,reelT:0,skim:0,cool:0,forbid:0,ready:0,safety:0}}
function capOm(b){const max=22+Math.min(6,b.combo*0.35);const sp=Math.abs(b.om)*b.L;if(sp>max)b.om=Math.sign(b.om||1)*max/b.L}

function grabReach(b){
  const h=Math.max(0,(b.maxY||b.y||0)-ORIGIN);

  if(h<16)return 3.75;
  if(h<28)return 3.45;

}
function pickAnchor(b,t){
  const reach=grabReach(b);
  const src=b.aid||b.forbid;
  const srcA=src?aById(seed,src):null;
  const floorY=srcA?srcA.y+0.45:b.y+0.2;
  collect(seed,Math.min(b.y,floorY)-0.5,Math.max(b.y,floorY)+reach+1.2);
  let best=null,bs=1e9;
  for(const a of nearA){
    if(b.broken.has(a.id)||a.id===b.aid)continue;
    if(b.cool>0&&a.id===b.forbid)continue;
    const ap=apos(a,t);
    if(ap.y<floorY)continue;
    const dx=ap.x-b.x, dy=ap.y-b.y, d=Math.hypot(dx,dy);
    if(dy<0.12||d<0.65||d>reach)continue;
    const s=d+Math.abs(dx)*0.12;

  }

function tryGrab(b,t){
  const a=pickAnchor(b,t); if(!a)return false;
  const ap=apos(a,t); const dist=Math.hypot(b.x-ap.x,b.y-ap.y);

    const side=Math.abs(b.vx)>0.8?Math.sign(b.vx):(th>=0?-1:1);

    const side=th>=0?-1:1;

  const cap=b.combo<=3?6.4:4.6;

function aimAnchor(b,t){
  const o=opening(b);
  collect(seed,b.y-1.5,b.y+11);
  const cur=b.aid?aById(seed,b.aid):null;
  const floorY=cur?cur.y+0.55:b.y+0.4;
  let best=null,bs=1e9;
  for(const a of nearA){
    if(a.id===b.aid||b.broken.has(a.id))continue;
    const ap=apos(a,t);
    if(ap.y<floorY)continue;
    const dx=ap.x-b.x, dy=ap.y-b.y;
    if(dy<0.35)continue;
    const d=Math.hypot(dx,dy);
    if(d<1.05||d>GRAB+1.3+o*1.4)continue;
    const s=d+(a.main?0:2.4)+(a.type==='crumble'?0.6:0);
    if(s<bs){bs=s;best=a}
  }

function release(b,whip){
  if(b.state!=='swing'){b.state='air';return}
  b.forbid=b.aid; b.cool=whip?0.07:0.16;
  if(whip){
    const early=b.combo<=3;
    if(early){
      const nxt=nextMain(b);
      if(nxt){
        const ap=apos(nxt,simT);
        const dx=ap.x-b.x, dy=Math.max(0.55,ap.y-b.y), d=Math.hypot(dx,dy)||1;

        b.vy=b.vy*0.12+(dy/d)*sp*0.88;

    }

  }

function tryDash(b,q){
  if(!b.dash||b.state!=='air'||b.dead)return;
  const a=q*(Math.PI/4); const dx=Math.cos(a), dy=Math.sin(a);
  b.vx+=dx*11.5; b.vy+=dy*13.2; b.dash=0; b.evDash=1; capV(b,33);

function handleHold(b,t){
  if(b.held&&!b.prevHeld)b.arm=1;
  if(!b.held){
    if(b.state==='swing')release(b,true);
    b.arm=0;
  }
  b.prevHeld=b.held;
  if(b.arm&&b.state==='air'&&b.lock<=0){if(tryGrab(b,t)){b.arm=0;if(b===player)taught.h=1}}
}
function stepAir(b){
  b.vy-=G*DT;

  for(const p of parts){
    if(!p.on)continue;
    const a=Math.max(0,p.life/p.max);
    const q=worldTo(p.x,p.y,s.camX,s.camY,viewH,w,h);
    g.globalAlpha=a;
    if(p.kind==='smoke'){
      g.fillStyle='rgba(70,42,36,'+(a*0.22)+')';
      g.beginPath();g.arc(q[0],q[1],Math.max(8,p.r*ppm*1.5),0,TAU);g.fill();
    }else if(p.kind==='ember'&&glowE){
      const rad=Math.max(7,p.r*ppm*2.4);
      g.drawImage(glowE,q[0]-rad,q[1]-rad,rad*2,rad*2);
    }else{
      g.fillStyle=p.col;
      g.beginPath();g.arc(q[0],q[1],Math.max(1.1,p.r*ppm*a),0,TAU);g.fill();
    }
  }
  g.globalAlpha=1;
}

let buf,bctx;
function ensureBuf(w,h){if(!buf){buf=document.createElement('canvas');bctx=buf.getContext('2d',{alpha:false})}if(buf.width!==w||buf.height!==h){buf.width=w;buf.height=h}}
function makeHaze(){
  const n=48, rnd=mulberry32(0xA7E5), g0=new Float32Array(n*n), b=new Float32Array(n*n);
  for(let i=0;i<g0.length;i++)g0[i]=rnd()*2-1;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let a=0;for(let oy=-2;oy<=2;oy++)for(let ox=-2;ox<=2;ox++)a+=g0[((y+oy+n)%n)*n+((x+ox+n)%n)];b[y*n+x]=a/25}

  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const i=y*n+x;
    haze[i*2]=(b[i]-b[y*n+((x+1)%n)])*40;
    haze[i*2+1]=(b[i]-b[((y+1)%n)*n+x])*28;
  }
}
function drawHaze(ctx,src,lavaScreen,w,h,dpr,wallT,shx,shy,sx,sy){
  if(!haze)makeHaze();
  sx=sx||dpr; sy=sy||dpr;
  const band=phase==='dead'?90:140;
  const y0=Math.max(0,lavaScreen-band), y1=Math.min(h,lavaScreen+6);
  if(y1<=y0+8)return;
  const tile=84, n=48, span=y1-y0;
  ctx.imageSmoothingEnabled=true;
  for(let y=y0;y<y1;y+=tile){
    const k=clamp((y1-y)/span,0,1), amp=k*k;
    const th=Math.min(tile,y1-y);

      const tw=Math.min(tile,w-x);
      const nx=Math.floor(((x*0.35+wallT*28)%n)+n)%n;
      const ny=Math.floor(((y*0.35+wallT*18)%n)+n)%n;
      const i=(ny*n+nx)*2;
      const dx=haze[i]*amp*0.85, dy=haze[i+1]*amp*0.85;

    }
  }
}

function startClip(){
  const btn=document.getElementById('btnClip');
  if(!canClip||clipBusy||phase!=='dead')return;
  const mime=pickMime(); if(!mime){if(btn)btn.hidden=true;setClipLabel('CLIP');return}
  const frames=ringOrdered(); if(frames.length<2){toast('NO CLIP');setClipLabel('CLIP');return}
  clipBusy=true; clipBlob=null; const token=exportToken; setClipLabel('SAVING');
  const tmp=document.createElement('canvas'); tmp.width=720; tmp.height=1280; const g=tmp.getContext('2d');
  let stream; try{stream=tmp.captureStream(30)}catch(e){clipBusy=false;setClipLabel('CLIP');if(btn)btn.hidden=true;return}
  let rec; try{rec=new MediaRecorder(stream,{mimeType:mime})}catch(e){clipBusy=false;setClipLabel('CLIP');if(btn)btn.hidden=true;return}
  const chunks=[]; rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const stopped=new Promise(r=>{rec.onstop=()=>r();rec.onerror=()=>r()});
  rec.start(100);
  const playMs=frames.length/60*1000;
  const holdMs=1100;
  const t0=performance.now();
  function pump(){
    if(token!==exportToken){try{rec.stop()}catch(e){}stream.getTracks().forEach(t=>t.stop());clipBusy=false;setClipLabel('CLIP');return}
    const elapsed=performance.now()-t0;
    if(elapsed<playMs){
      let idx=elapsed/ (playMs/frames.length);
      const base=frames[Math.min(frames.length-1,Math.floor(idx))];
      const prev=frames[Math.max(0,Math.min(frames.length-1,Math.floor(idx)-1))];
      const slow=base&&base.close?0.45:1;
      idx=Math.min(frames.length-1, idx);
      const s=frames[Math.min(frames.length-1,Math.floor(idx*slow+(1-slow)*Math.max(0,idx-8)))];
      paintExport(g,s||base,0);
    }else if(elapsed<playMs+holdMs){
      paintExport(g,frames[frames.length-1],(elapsed-playMs)/holdMs);
    }else{
      try{rec.stop()}catch(e){}
      stopped.then(()=>{stream.getTracks().forEach(t=>t.stop());if(token!==exportToken){clipBusy=false;setClipLabel('CLIP');return}clipBlob=new Blob(chunks,{type:mime.split(';')[0]});clipBusy=false;setClipLabel('SAVE CLIP')});
      return;
    }
    requestAnimationFrame(pump);
  }
  paintExport(g,frames[0],0);
  requestAnimationFrame(pump);
}
function paintExport(g,s,reveal){

  const lavaS=worldTo(0,s.lava,s.camX,s.camY,VIEW_H/(reveal?1+0.1*reveal:1),390,844)[1];

  g.fillStyle='#fff6ea';g.font='700 42px '+FONT;g.textAlign='center';g.fillText('UPSWING',360,78);
  g.fillStyle='#ffc56d';g.font='700 18px '+FONT;g.fillText('HOLD  ·  RELEASE',360,108);

  document.getElementById('aDaily').onclick=()=>{closeSheet();applyDaily();phase='attract';ghost=null;if(rival)spawnAttractGhost()};
  document.getElementById('aNew').onclick=()=>{closeSheet();isDaily=false;dayNum=0;seed=mix(Date.now()&0x7fffffff,1)%1000000000||2;rival=null;ghost=null;phase='attract';ensure(seed,2)};

}

  if(q.get('seed')!=null&&q.get('seed')!==''){const n=Number(q.get('seed'));if(Number.isFinite(n)){seed=Math.floor(Math.abs(n))%2147483647||1;isDaily=false;dayNum=0;ensure(seed,2);rival=null;return}}

function loop(now){
  const dtMs=lastT?now-lastT:16;
  if(!paused&&!manual&&!document.hidden){
    let dt=Math.min(0.05,dtMs/1000);
      if(phase==='run'){
      if(hitStop>0){hitStop-=dt;dt*=reduced?1:0.2}
      if(scaleT>0){scaleT-=dt;dt*=reduced?1:0.34}
      if(closeCd>0)closeCd-=dt;
      acc+=dt;let n=0;const cap=fx>=1?8:5;
      while(acc>=DT&&n<cap){stepWorld();acc-=DT;n++}
      if(n===cap)acc=0;
      burstFromPlayer();
      updateBed(player?Math.hypot(player.vx,player.vy):0, player&&player.state==='swing');
      const danger=player?clamp(1-(player.y-lava)/4.2,0,1):0;
      updateMusic(player?Math.max(0,player.maxY-ORIGIN):0, danger, scaleT>0);
    }else if(audioUnlocked&&phase==='dead'){
      updateMusic(player?Math.max(0,player.maxY-ORIGIN):0, 0.2, true);
    }
    updateParts(dt*(phase==='dead'?1:(scaleT>0?0.34:1)));
    updateFloats(dt);
    if(Math.random()<dt*(fx>=2?8:4)){const x=(camX||0)+(Math.sin(now*0.001)*0.5)*(fx+2);emit(x,lava+0.15,1,{sp:0.6,life:0.9,r:0.05,vy:1.4,g:-1,col:Math.random()<0.5?'#ffd7a8':'#ff7a3a',kind:'ember'})}
    if(fx>=1&&Math.random()<dt*2.4){emit((camX||0)+(Math.random()-0.5)*7,lava+0.35,1,{sp:0.25,life:1.5,r:0.18,vy:0.7,vx:(Math.random()-0.5)*0.5,col:'#3a2420',kind:'smoke',grow:0.05})}
  }else{acc=0}
  if(frames>90){ema=ema*0.9+dtMs*0.1;if(ema>22&&fx>1)fx--;else if(ema<17.2&&fx<2)fx++}
  frames++;
  lastT=now;
  render(now, dtMs);
  requestAnimationFrame(loop);
}

function simulate(sd,events,head,maxTicks){
  const saved={seed,lava,simT,tick,player,ghost,rival,log:log.slice(),phase};
  seed=sd; ensure(sd,2);
  const body=makeBody(); body.broken=new Set();
  // place uses global seed
  const prevPlayer=player; player=body;
  place(body,head||0);
  player=prevPlayer;
  let t=0, lv=LAVA0, hold=false, ei=0, steps=0;
  const samples=[];
  body.held=false; body.prevHeld=false;
  for(let tk=0;tk<maxTicks;tk++){
    while(ei<events.length&&events[ei].t<=tk){const e=events[ei++];if(e.k===1)body.held=true;else if(e.k===2)body.held=false;else if(e.k===3)tryDash(body,e.dir|0)}
    const ps=seed; seed=sd; const pt=simT; simT=t; const pl=lava; lava=lv;
    stepBody(body,t);
    seed=ps; simT=pt; lava=pl;
    t+=DT; lv+=lavaSpeed(t)*DT; steps++;
    if(!Number.isFinite(body.y)){
      seed=saved.seed; lava=saved.lava; simT=saved.simT; tick=saved.tick; player=saved.player; ghost=saved.ghost; phase=saved.phase;
      return {ok:false,y:body.y,steps};
    }
    if(body.dead)break;
    if(tk%30===0)samples.push(+body.y.toFixed(3));
  }
  seed=saved.seed; lava=saved.lava; simT=saved.simT; tick=saved.tick; player=saved.player; ghost=saved.ghost; phase=saved.phase;
  return {ok:Number.isFinite(body.y),y:+body.maxY.toFixed(3),steps,samples,score:scoreOf(body.maxY),dead:body.dead};
}
function soakAI(sd,maxTicks){
  const saved={seed,lava,simT,tick,player,ghost,phase};
  seed=sd; ensure(sd,8);
  const body=makeBody(); body.broken=new Set();
  place(body,0);
  let t=0, lv=LAVA0;
  for(let tk=0;tk<maxTicks&&!body.dead;tk++){
    seed=sd; simT=t; lava=lv;
    const w=aiWant(body);
    body.held=!!w.hold;
    if(w.dash!=null)tryDash(body,w.dash);
    stepBody(body,t);
    t+=DT; lv+=lavaSpeed(t)*DT;
  }
  const out={score:scoreOf(body.maxY),dead:!!body.dead,y:+body.maxY.toFixed(3)};
  seed=saved.seed; lava=saved.lava; simT=saved.simT; tick=saved.tick; player=saved.player; ghost=saved.ghost; phase=saved.phase;
  return out;
}
function runPolicy(sd,policy,maxTicks,trace){
  const saved={seed,lava,simT,tick,player,ghost,phase};
  seed=sd; ensure(sd,16);
  const body=makeBody(); body.broken=new Set();
  place(body,0);
  let t=0, lv=LAVA0, close=0, grabs=0, dashes=0, minGap=99; const marks=[], evs=[];
  for(let tk=0;tk<maxTicks&&!body.dead;tk++){
    seed=sd; simT=t; lava=lv;
    const w=policy(body,tk);
    body.held=!!w.hold;
    if(w.dash!=null)tryDash(body,w.dash);
    const prevY=body.y, prevSt=body.state, prevVy=body.vy, prevTh=body.th, prevAid=body.aid;
    stepBody(body,t);
    if(trace&&evs.length<48&&(body.evGrab||body.evRel||body.evDash))evs.push((body.evGrab?'G':body.evDash?'D':'R')+scoreOf(body.y)+' vy'+prevVy.toFixed(1)+' th'+prevTh.toFixed(2)+' a'+body.aid);
    if(body.evClose)close++;
    if(body.evGrab)grabs++;
    if(body.evDash)dashes++;
    const gap=body.y-lv; if(gap<minGap)minGap=gap;
    if(tk%240===0)marks.push(scoreOf(body.y)+'@'+t.toFixed(0)+'/L'+lv.toFixed(1));
    body.evGrab=body.evRel=body.evDash=body.evClose=body.evPerfect=body.evBonk=body.evGold=body.evPass=0;
    t+=DT; lv+=lavaSpeed(t)*DT;
  }
  const out={score:scoreOf(body.maxY),dead:!!body.dead,y:+body.maxY.toFixed(2),close,sec:+(t).toFixed(1),grabs,dashes,minGap:+minGap.toFixed(2),marks}; if(trace)out.evs=evs;
  seed=saved.seed; lava=saved.lava; simT=saved.simT; tick=saved.tick; player=saved.player; ghost=saved.ghost; phase=saved.phase;
  return out;
}
function gradeSeed(sd){
  const mash=(b,tk)=>{const span=7+(Math.floor(tk/13)%8);return {hold:(tk%span)<3,dash:null}};
  let sAid=0;
  const stranger=(b)=>{
    if(b.state!=='swing'||b.aid===sAid)return {hold:true,dash:null};
    const nxt=nextMain(b), cur=aById(seed,b.aid);
    if(!nxt||!cur)return {hold:true,dash:null};
    const toward=(nxt.x-cur.x)*b.vx>0.2;
    if(toward&&b.vy>3.1&&Math.abs(b.th)>0.5){sAid=b.aid;return {hold:false,dash:null}}
    if(b.hang>0.7&&b.vy>1.4){sAid=b.aid;return {hold:false,dash:null}}
    return {hold:true,dash:null};
  };
  let rc=0;
  const rhythm=(b)=>{
    if(rc>0){rc--;return {hold:false,dash:null}}
    if(b.state!=='swing')return {hold:true,dash:null};
    const nxt=nextMain(b), cur=aById(seed,b.aid);
    const toward=!nxt||!cur||(nxt.x-cur.x)*b.vx>0.15;
    if(toward&&b.vy>4.2&&Math.abs(b.th)>0.7){rc=2;return {hold:false,dash:null}}
    return {hold:true,dash:null};
  };
  const N=120*48;
  return {mash:runPolicy(sd,mash,N),stranger:runPolicy(sd,stranger,N),rhythm:runPolicy(sd,rhythm,N),clean:runPolicy(sd,aiWant,N)};
}
function runQA(){
  const report=[];
  const check=(n,c,extra)=>report.push({name:n,ok:!!c,extra:extra==null?'':String(extra)});
  check('bad ghost', decodeRun('@@@')===null);
  check('bad empty', decodeRun('')===null);
  check('seed fallback type', Number.isFinite(Number('foo'))===false);
  const ev=[]; for(let t=0;t<1200;t+=90){ev.push({t,k:1});ev.push({t:t+60,k:2})}
  // roundtrip
  log.length=0; ev.forEach(e=>log.push(e)); player=makeBody(); player.maxY=40; const code=encodeRun(); const back=decodeRun(code);
  check('roundtrip', back&&back.events.length===ev.length&&back.seed===seed, back&&back.events.length);
  const a=simulate(seed,ev,0,600); const b=simulate(seed,ev,0,600);
  check('deterministic', a.ok&&b.ok&&a.y===b.y&&a.samples.join()===b.samples.join(), a.y+' / '+b.y);
  const soak=soakAI(7,120*16); const soakB=soakAI(7,120*16);
  check('script climbs', soak.score>=12, 'score '+soak.score+' y '+soak.y+' dead '+soak.dead);
  check('ai stable', soak.score===soakB.score, soak.score+'/'+soakB.score);
  ensure(seed,25); let gapOk=true,worst=0,minG=99,prev=null;
  for(let i=0;i<=25;i++){const c=chunkCache.get(seed+':'+i);for(const an of c.anchors){if(!an.main)continue;if(prev){const d=Math.hypot(an.x-prev.x,an.y-prev.y);if(d>worst)worst=d;if(d<minG)minG=d;if(d>4.0||d<1.75)gapOk=false}prev=an}}
  check('path gaps', gapOk&&worst<4.05&&minG>1.7, 'worst '+worst.toFixed(2)+' min '+(minG>90?'none':minG.toFixed(2)));
  const longEv=[]; for(let t=0;t<120*25;t+=80){longEv.push({t,k:1});longEv.push({t:t+50,k:2})}
  const long=simulate(dailySeed(293),longEv,0,120*25);
  check('long finite', long.ok, 'y '+long.y+' score '+long.score);
  const realSet=localStorage.setItem.bind(localStorage);
  let threw=false;
  localStorage.setItem=()=>{threw=true;throw new Error('full')};
  let survived=true; try{lsSet('us:v1:qa',{a:1})}catch(e){survived=false}
  localStorage.setItem=realSet;
  check('storage full', survived&&threw, survived);
  // rapid restart state
  resetRun(false); const t1=tick; resetRun(false); check('restart', phase==='run'&&tick===0&&player&&!player.dead);
  window.__QA__=report;
  return report;
}

window.UPSWING={
  get phase(){return phase},
  get seed(){return seed},
  get tick(){return tick},
  state(){return player?{x:+player.x.toFixed(3),y:+player.y.toFixed(3),vx:+player.vx.toFixed(2),vy:+player.vy.toFixed(2),st:player.state,th:+player.th.toFixed(2),L:+player.L.toFixed(2),om:+player.om.toFixed(2),aid:player.aid,score:scoreOf(player.maxY),lava:+lava.toFixed(2),combo:player.combo,dash:player.dash,phase,seed,tick,cam:+camY.toFixed(2),fx}:{phase}},
  hold(v){wantHold=!!v},
  dash(q){if(q!=null)dashQueue=q&7},
  step(n){for(let i=0;i<n;i++){if(phase!=='run')break;stepWorld();burstFromPlayer()}},
  reset(o){if(o&&o.seed){seed=o.seed;isDaily=false;dayNum=0;ensure(seed,2)}resetRun(false);if(o&&o.hold)wantHold=true},
  kill(){if(player){player.y=lava-1;player.dead=true;die()}},
  decode:decodeRun, encode:encodeRun, simulate,
  soak(sd,n){return soakAI(sd||seed, n||120*12)},
  grades(sd){return gradeSeed(sd||seed)},
  line(sd){ensure(sd||seed,4);const o=[];let p=null;for(let i=0;i<=3;i++){const c=chunkCache.get((sd||seed)+':'+i);if(!c)continue;for(const a of c.anchors){if(!a.main)continue;const d=p?Math.hypot(a.x-p.x,a.y-p.y):0;o.push(a.id+' '+a.x.toFixed(2)+','+a.y.toFixed(2)+(p?' d'+d.toFixed(2):''));p=a}}return o},
  trace(sd,kind){
    const mash=(b,tk)=>{const span=7+(Math.floor(tk/13)%8);return {hold:(tk%span)<3,dash:null}};
    let sAid=0; const stranger=(b)=>{if(b.state!=='swing'||b.aid===sAid)return {hold:true,dash:null}; const nxt=nextMain(b), cur=aById(seed,b.aid); const toward=!nxt||!cur||(nxt.x-cur.x)*b.vx>0.2; if(toward&&b.vy>2.2&&Math.abs(b.th)>0.38){sAid=b.aid;return {hold:false,dash:null}} if(b.hang>0.7&&b.vy>1.4){sAid=b.aid;return {hold:false,dash:null}} return {hold:true,dash:null}};
    let rc=0; const rhythm=(b)=>{if(rc>0){rc--;return {hold:false,dash:null}} if(b.state==='swing'&&b.vy>3.2&&Math.abs(b.th)>0.45){rc=8;return {hold:false,dash:null}} return {hold:true,dash:null}};
    const pol=kind==='mash'?mash:kind==='stranger'?stranger:kind==='rhythm'?rhythm:aiWant;
    return runPolicy(sd||seed,pol,120*20,true);
  },
  auto(v){autoplay=!!v;const gear=document.getElementById('gear');if(gear)gear.hidden=!!autoplay;if(autoplay&&phase!=='run')resetRun(false)},
  setManual(v){manual=!!v;acc=0}
};
