/* ---------- utils ---------- */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function announced(s) { const n = document.getElementById('live'); if (n) n.textContent = s; }
function rrect(c, x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + rr, y);
  c.arcTo(x + w, y, x + w, y + h, rr);
  c.arcTo(x + w, y + h, x, y + h, rr);
  c.arcTo(x, y + h, x, y, rr);
  c.arcTo(x, y, x + w, y, rr);
  c.closePath();
}
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function hashParts() { return hashString(Array.prototype.join.call(arguments, '|')); }
function mulberry32(a) {
  let t = a >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let x = Math.imul(t ^ (t >>> 15), t | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function dailyNumber(d) {
  d = d || new Date();
  const utc = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  const epoch = Date.UTC(2026, 0, 1);
  return Math.floor((utc - epoch) / 86400000) + 1;
}
function seedCode(seed) { return (seed >>> 0).toString(36).toUpperCase().padStart(4, '0').slice(-5); }
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
  catch (e) { return fallback; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function shownPct(frac) { return Math.round(clamp(frac, 0, 1.5) * 1000) / 10; }
function pipsOf(fizz) {
  if (fizz < 0.15) return 1;
  if (fizz < 0.24) return 2;
  if (fizz < 0.34) return 3;
  if (fizz < 0.45) return 4;
  return 5;
}

/* ---------- shapes ---------- */
function halfWidth(shape, t) {
  const e = t * t * (3 - 2 * t);
  return shape.baseHW + (shape.rimHW - shape.baseHW) * e + shape.bulge * Math.sin(Math.PI * t);
}
function buildVolumes() {
  Object.keys(SHAPES).forEach(function (name) {
    const shape = SHAPES[name];
    const N = 48;
    const raw = [];
    let sum = 0;
    for (let i = 0; i < N; i++) {
      const t = (i + 0.5) / N;
      const r = Math.max(2, halfWidth(shape, t) * 0.84);
      const a = r * r;
      raw.push(a); sum += a;
    }
    const cum = [0];
    let c = 0;
    for (let i = 0; i < N; i++) { c += raw[i]; cum.push(c / sum); }
    shape.vol = cum;
  });
}
function volToT(shape, frac) {
  const table = shape.vol;
  frac = clamp(frac, 0, 1);
  const N = table.length - 1;
  for (let i = 1; i <= N; i++) {
    if (table[i] >= frac - 1e-8) {
      const span = table[i] - table[i - 1] || 1;
      return ((i - 1) + (frac - table[i - 1]) / span) / N;
    }
  }
  return 1;
}

/* ---------- board generation (deterministic) ---------- */
function makeSpec(mode, index, rng) {
  const j = (rng() - 0.5) * 0.06;
  if (mode === 'challenge') {
    const plans = [
      { d: clamp(0.05 + j, 0, 1), shape: 'tumbler', tower: null, sleeve: false },
      { d: clamp(0.18 + j, 0, 1), shape: 'highball', tower: null, sleeve: false },
      { d: clamp(0.34 + j, 0, 1), shape: rng() < 0.55 ? 'tulip' : 'highball', tower: null, sleeve: false },
      { d: clamp(0.58 + j * 0.5, 0, 1), shape: 'flute', tower: null, sleeve: false },
      { d: clamp(0.40 + j, 0, 1), shape: 'highball', tower: 'stack', sleeve: false }
    ];
    return plans[Math.min(index, plans.length - 1)];
  }
  if (mode === 'zen') {
    const shapes = ['tumbler', 'highball', 'tulip', 'flute', 'coupe', 'highball'];
    const tower = index % 3 === 2 ? (index % 6 === 5 ? 'pyramid' : 'stack') : null;
    return {
      d: (index * 0.173) % 1,
      shape: shapes[index % shapes.length],
      tower: tower,
      sleeve: false,
      spill: index % 11 === 8
    };
  }
  const n = index + 1;
  const relief = n % 5 === 0;
  let d = relief ? 0.10 : clamp(0.06 + index * 0.05 + j, 0, 0.95);
  let shape = 'highball';
  if (d < 0.16) shape = 'tumbler';
  else if (d > 0.62) shape = rng() < 0.65 ? 'flute' : 'tulip';
  else if (d > 0.38) shape = rng() < 0.5 ? 'tulip' : 'highball';
  if (relief) shape = rng() < 0.5 ? 'tumbler' : 'coupe';
  let tower = null;
  if (!relief && n >= 6 && n % 4 === 2) tower = 'stack';
  if (!relief && n >= 11 && n % 5 === 1) tower = 'pyramid';
  const sleeve = !relief && !tower && n >= 8 && n % 4 === 0;
  return { d: d, shape: shape, tower: tower, sleeve: sleeve, spill: false };
}

function makeGlass(shapeName, diff, rng, sleeve) {
  const shape = SHAPES[shapeName] || SHAPES.highball;
  const d = clamp(diff, 0, 1);
  const pipsTarget = d < 0.13 ? 1 : d < 0.27 ? 2 : d < 0.42 ? 3 : d < 0.60 ? 4 : d < 0.78 ? 5 : 6;
  const bands = [
    [0.09, 0.14], [0.16, 0.23], [0.25, 0.33], [0.35, 0.44], [0.46, 0.56], [0.52, 0.62]
  ];
  const band = bands[pipsTarget - 1];
  const fizz = lerp(band[0], band[1], rng());
  const foamNow = lerp(0.035, 0.15, (pipsTarget - 1) / 5) * lerp(0.88, 1.12, rng());
  const riseTime = lerp(TUNE.riseMin, TUNE.riseMax, rng());
  const hold = lerp(TUNE.holdEasy, TUNE.holdHard, d);
  const capacity = shape.capacity * lerp(0.96, 1.04, rng());
  const pourRate = capacity / ((1 + fizz) * hold);
  const drink = DRINKS[Math.min(DRINKS.length - 1, pipsTarget - 1)];
  const drops = [];
  const nd = 8 + Math.floor(rng() * 6);
  for (let i = 0; i < nd; i++) {
    const side = rng() < 0.5 ? -1 : 1;
    drops.push({
      t: 0.12 + rng() * 0.72,
      u: side * (0.72 + rng() * 0.28),
      r: 1.1 + rng() * 2.1,
      slide: 0.008 + rng() * 0.02
    });
  }
  return {
    shapeName: shapeName, shape: shape, capacity: capacity, pourRate: pourRate,
    fizz: fizz, foamNow: foamNow, riseTime: riseTime, drink: drink,
    pips: Math.min(5, pipsTarget), sleeve: !!sleeve, drops: drops,
    childIdx: [], body: 0, foam: 0, pending: 0, spilled: false, spillAmt: 0,
    spillPlayed: false, wave: 0, waveV: 0, tilt: 0, tiltV: 0, rip: rng() * 6,
    present: 0, squash: 1, inflow: 0, overflowVis: 0, bubbleAcc: 0,
    x: 195, footY: 640, scale: 1, h: shape.h, stem: shape.stem
  };
}

function buildServe(mode, seed, index) {
  const rng = mulberry32(hashParts('fizz-serve-v1', seed, mode, index));
  const spec = makeSpec(mode, index, rng);
  const glasses = [];
  if (!spec.tower) {
    glasses.push(makeGlass(spec.shape, spec.d, rng, spec.sleeve));
  } else if (spec.tower === 'stack') {
    const top = makeGlass('highball', spec.d, rng, false);
    const bot = makeGlass('tumbler', Math.max(0.08, spec.d * 0.55), rng, false);
    bot.drink = top.drink;
    bot.pips = Math.max(1, top.pips - 1);
    bot.fizz = top.fizz * 0.25;
    top.fizz *= 0.55;
    top.childIdx = [1];
    top.capacity *= 0.7;
    top.pourRate *= 0.7;
    bot.capacity = top.capacity * 0.78;
    glasses.push(top, bot);
  } else {
    const top = makeGlass('tulip', spec.d, rng, false);
    const a = makeGlass('highball', spec.d * 0.4, rng, false);
    const b = makeGlass('highball', spec.d * 0.4, rng, false);
    b.capacity = a.capacity;
    top.fizz *= 0.55;
    b.fizz = a.fizz = top.fizz * 0.35;
    b.foamNow = a.foamNow;
    b.drink = a.drink = top.drink;
    b.pips = a.pips = Math.max(1, top.pips - 1);
    b.pourRate = a.pourRate;
    top.childIdx = [1, 2];
    top.capacity *= 0.66;
    top.pourRate *= 0.66;
    a.capacity = top.capacity * 0.48;
    b.capacity = a.capacity;
    glasses.push(top, a, b);
  }
  glasses.forEach(function (g) {
    g.body = 0; g.foam = 0; g.pending = 0; g.spilled = false; g.spillAmt = 0;
    g.spillPlayed = false; g.wave = 0; g.waveV = 0; g.present = 0; g.squash = 1; g.inflow = 0;
  });
  return { glasses: glasses, spec: spec, salt: rng() * 0.018, mode: mode, index: index };
}

/* ---------- sim ---------- */
function rateNow(g, serve) {
  let vis = clamp((g.body + g.foam) / g.capacity, 0, 1);
  // Once the top glass is full, the danger moves to the glass catching the overflow.
  if (serve && g.childIdx && g.childIdx.length && vis >= 0.992) {
    let childVis = 0;
    for (let i = 0; i < g.childIdx.length; i++) {
      const c = serve.glasses[g.childIdx[i]];
      childVis = Math.max(childVis, (c.body + c.foam) / c.capacity);
    }
    vis = childVis;
  }
  const cascading = serve && g.childIdx && g.childIdx.length && (g.body + g.foam) / g.capacity >= 0.992;
  const k = smooth(clamp((vis - 0.4) / 0.5, 0, 1));
  // A cascade should move, then crawl once the lower glass is near the rim.
  let m = cascading ? lerp(1.85, 0.22, k) : lerp(TUNE.slowStart, TUNE.slowEnd, k);
  if (vis > 0.88) m *= lerp(1, 0.55, clamp((vis - 0.88) / 0.12, 0, 1));
  return g.pourRate * m;
}
function stepGlassLocal(g, dt, pouring, serve) {
  if (pouring) {
    const q = rateNow(g, serve) * dt;
    g.body += q * (1 - g.foamNow);
    g.foam += q * g.foamNow;
    g.pending += q * g.fizz;
  }
  const convert = pouring ? 0.22 : (-Math.log(0.05) / Math.max(0.4, g.riseTime));
  const k = 1 - Math.exp(-convert * dt);
  const d = g.pending * k;
  g.pending -= d;
  g.foam += d;
}
function resolveOverflow(serve) {
  const glasses = serve.glasses;
  for (let i = 0; i < glasses.length; i++) {
    const g = glasses[i];
    g.inflow = 0;
  }
  for (let i = 0; i < glasses.length; i++) {
    const g = glasses[i];
    let occ = g.body + g.foam;
    if (occ > g.capacity) {
      const excess = occ - g.capacity;
      let e = excess;
      const takeF = Math.min(g.foam, e);
      g.foam -= takeF;
      e -= takeF;
      g.body = Math.max(0, g.body - e);
      if (g.childIdx.length) {
        const share = excess / g.childIdx.length;
        for (let c = 0; c < g.childIdx.length; c++) {
          const ch = glasses[g.childIdx[c]];
          ch.body += share * 0.68;
          ch.foam += share * 0.24;
          ch.pending += share * 0.08;
          ch.inflow += share;
          g.overflowVis += share;
        }
      } else {
        g.spilled = true;
        g.spillAmt += excess;
      }
    }
  }
}
function stepServe(serve, dt, pouring) {
  const root = serve.glasses[0];
  const blocked = serve.glasses.some(function (g) { return g.spilled; });
  stepGlassLocal(root, dt, pouring && !blocked, serve);
  for (let i = 1; i < serve.glasses.length; i++) stepGlassLocal(serve.glasses[i], dt, false, serve);
  resolveOverflow(serve);
}
function predictFractions(serve) {
  const glasses = serve.glasses;
  const body = glasses.map(function (g) { return g.body; });
  const foam = glasses.map(function (g) { return g.foam + g.pending; });
  const spilled = glasses.map(function () { return false; });
  for (let i = 0; i < glasses.length; i++) {
    const cap = glasses[i].capacity;
    const occ = body[i] + foam[i];
    if (occ > cap + 1e-5) {
      const excess = occ - cap;
      const kids = glasses[i].childIdx;
      if (!kids.length) spilled[i] = true;
      else {
        const share = excess / kids.length;
        for (let k = 0; k < kids.length; k++) {
          const j = kids[k];
          body[j] += share * 0.68;
          foam[j] += share * 0.32;
        }
      }
      let e = excess;
      const takeF = Math.min(foam[i], e);
      foam[i] -= takeF;
      e -= takeF;
      body[i] = Math.max(0, body[i] - e);
    }
  }
  return glasses.map(function (g, i) {
    if (spilled[i]) return 9;
    return (body[i] + foam[i]) / g.capacity;
  });
}
function zenShouldStop(serve) {
  if (serve.spec && serve.spec.spill) return false;
  if (serve.glasses.some(function (g) { return g.spilled; })) return true;
  const target = 0.968 + (serve.salt || 0);
  const preds = predictFractions(serve);
  if (preds.some(function (p) { return p >= 9; })) return true;
  if (preds.every(function (p) { return p >= target && p <= 1.002; })) return true;
  return false;
}
function stepWaves(serve, dt, pouring) {
  for (let i = 0; i < serve.glasses.length; i++) {
    const g = serve.glasses[i];
    const driven = pouring && i === 0;
    const drive = driven ? Math.sin(G.simT * 13) * 7 : 0;
    g.waveV += (drive - g.wave * 40 - g.waveV * 6.4) * dt;
    g.wave += g.waveV * dt;
    g.wave = clamp(g.wave, -11, 11);
    const tiltDrive = driven ? clamp((G.fingerX - g.x) / Math.max(1, W), -1, 1) * 0.9 : 0;
    g.tiltV += (tiltDrive - g.tilt * 24 - g.tiltV * 5.2) * dt;
    g.tilt += g.tiltV * dt;
    g.tilt = clamp(g.tilt, -1.3, 1.3);
    g.rip += dt * (driven ? 6.5 : 2.4);
    g.overflowVis = Math.max(0, g.overflowVis - dt * 1.4);
    for (let d = 0; d < g.drops.length; d++) {
      g.drops[d].t -= g.drops[d].slide * dt;
      if (g.drops[d].t < 0.08) g.drops[d].t = 0.78;
    }
  }
}

/* ---------- particles ---------- */
const bubbles = Array.from({ length: 140 }, function () { return { alive: false }; });
const sparks = Array.from({ length: 90 }, function () { return { alive: false }; });
const drops = Array.from({ length: 120 }, function () { return { alive: false }; });
const bits = Array.from({ length: 90 }, function () { return { alive: false }; });
function spawn(pool, init) {
  for (let i = 0; i < pool.length; i++) if (!pool[i].alive) { init(pool[i]); pool[i].alive = true; return pool[i]; }
  return null;
}
function killAll(pool) { for (let i = 0; i < pool.length; i++) pool[i].alive = false; }
function spawnBubble(g) {
  const frac = clamp((g.body + g.foam) / g.capacity, 0, 1);
  if (frac < 0.02) return;
  spawn(bubbles, function (b) {
    b.g = g;
    b.t = Math.random() * Math.max(0.04, volToT(g.shape, frac) * 0.92);
    b.u = (Math.random() * 2 - 1) * 0.78;
    b.r = 0.7 + Math.random() * (1.6 + g.pips * 0.35);
    b.speed = 28 + Math.random() * 70;
    b.ph = Math.random() * 6.28;
    b.wob = 1.5 + Math.random() * 3;
  });
}
function updateBubbles(dt) {

    drawTracked('BEST ' + Math.max(out.best || 0, out.score) + '   ·   STREAK ' + (out.bestStreak || 0), cx, y + 200, 12, 'rgba(244,239,230,0.75)', 1.2);
  } else if (out.win) {
    ctx.fillStyle = '#e9ff8a';
    ctx.fillText('YOU WIN', cx, y + 78);
    ctx.font = '800 72px ' + FONT;
    ctx.fillStyle = '#f6e2b6';
    ctx.fillText(out.payout || '', cx, y + 156);
    drawTracked(out.cleans + ' / 5 CLEAN', cx, y + 206, 13, 'rgba(244,239,230,0.8)', 1.6);
  } else {
    ctx.fillStyle = '#ffb1a4';
    ctx.fillText('NOT THIS TIME', cx, y + 78);
    ctx.font = '600 28px ' + FONT;
    ctx.fillStyle = '#f7f1e6';
    ctx.fillText(out.cleans + ' / 5 CLEAN', cx, y + 140);
    drawTracked('NEED 3 FOR ' + G.payout[0], cx, y + 180, 12, 'rgba(230,201,138,0.85)', 1.2);
  }
  if (out.note) {
    wrapText(out.note, cx, y + (G.mode === 'run' ? 228 : 236), cardW - 40, 14, 'rgba(240,215,162,0.92)');
  }
  // squares
  const sq = G.results.slice(0, 8);
  const sw = 36, sg = 8;
  const total = sq.length * sw + (sq.length - 1) * sg;
  let sx = cx - total / 2;
  const sy = y + (G.mode === 'run' ? 268 : 278);
  for (let i = 0; i < sq.length; i++) {
    const r = sq[i];
    let col = '#ff5a3c';
    if (!r.spill && r.perfect) col = '#b6e35a';
    else if (!r.spill && r.clean) col = '#e6c98a';
    else if (!r.spill && r.pct >= 80) col = '#e08a4a';
    else if (!r.spill) col = '#a84848';
    rrect(ctx, sx, sy, sw, sw, 8);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.fillStyle = '#1a120c';
    ctx.font = '700 11px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(r.spill ? '0' : r.pct.toFixed(0), sx + sw / 2, sy + 23);
    sx += sw + sg;
  }
  const emoji = G.results.map(function (r) {
    if (r.spill) return '💦';
    if (r.perfect) return '🟩';
    if (r.clean) return '🟨';
    if (r.pct >= 80) return '🟧';
    return '🟥';
  }).join('');
  drawTracked(emoji, cx, sy + 56, 16, '#f4efe6', 2);

  const bw = (cardW - 48) / 2;
  const again = addBtn({ id: 'again', x: cx - bw - 6, y: y + cardH - 78, w: bw, h: 52, r: 14, label: 'AGAIN', kind: 'primary', size: 15 });
  const menu = addBtn({ id: 'menu', x: cx + 6, y: y + cardH - 78, w: bw * 0.46, h: 52, r: 14, label: 'MENU', kind: 'ghost', size: 12 });
  const share = addBtn({ id: 'share', x: menu.x + menu.w + 8, y: y + cardH - 78, w: bw - menu.w - 8 + (bw - menu.w), h: 52, r: 14, label: 'SHARE', kind: 'ghost', size: 12 });
  // fix share width to fill
  share.x = menu.x + menu.w + 8;
  share.w = (cx + bw + 6) - share.x;
  drawButton(again); drawButton(menu); drawButton(share);
  ctx.restore();
}
function wrapText(text, x, y, maxW, size, color) {
  ctx.save();
  ctx.font = '600 ' + size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}
function drawToast() {
  if (!G.toast) return;
  const a = G.toast.age < 0.15 ? G.toast.age / 0.15 : G.toast.age > 1.45 ? Math.max(0, (1.8 - G.toast.age) / 0.35) : 1;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '700 12px ' + FONT;
  const w = ctx.measureText(G.toast.text).width + 28;
  rrect(ctx, (W - w) / 2, SAT + 8, w, 28, 14);
  ctx.fillStyle = '#f0d7a2';
  ctx.fill();
  ctx.fillStyle = '#2a1c10';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(G.toast.text, W / 2, SAT + 22);
  ctx.restore();
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0c0a10';
  ctx.fillRect(0, 0, W, H);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  // drifting bokeh on top of cache
  ctx.save();
  const drift = [
    { x: W * (0.2 + Math.sin(G.t * 0.15) * 0.04), y: H * 0.3, r: 50, c: 'rgba(255,190,130,0.05)' },
    { x: W * (0.75 + Math.cos(G.t * 0.12) * 0.03), y: H * 0.55, r: 70, c: 'rgba(140,170,255,0.04)' }
  ];
  for (let i = 0; i < drift.length; i++) {
    const d = drift[i];
    const rg = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
    rg.addColorStop(0, d.c); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.3); ctx.fill();
  }
  ctx.restore();

  resetButtons();
  ctx.save();
  applyCamera();
  drawBar();
  drawPuddles();
  drawShaft(G.screen === 'title' ? G.demo : (G.serve ? G.serve.glasses[0] : null));
  const pouring = (G.screen === 'play' && G.phase === 'pour') || (G.screen === 'title' && G.demo && G.demo._pour);
  const glass = G.screen === 'title' ? G.demo : (G.serve ? G.serve.glasses[0] : null);
  if (G.screen !== 'title' && G.serve) {
    // draw children first (they sit behind / below)
    for (let i = G.serve.glasses.length - 1; i >= 0; i--) {
      const gl = G.serve.glasses[i];
      drawGlass(gl, easeOut(clamp(gl.present, 0, 1)));
    }
  } else if (G.demo) {
    drawGlass(G.demo, G.screen === 'end' ? 0.4 : 1);
  }
  if (pouring && glass) {
    const tip = drawFaucet(glass.x - 8, (G.faucetY || rimY(glass) - 100));
    G.faucetTip = tip;
    drawStream(glass, tip);
  } else if (G.screen === 'play' && G.serve && G.phase !== 'exit') {
    // faucet at rest, no stream
    const g0 = G.serve.glasses[0];
    if (g0.present > 0.4) drawFaucet(g0.x - 8, G.faucetY || rimY(g0) - 100);
  } else if (G.screen === 'title' && G.demo) {
    drawFaucet(G.demo.x - 8, G.faucetY || rimY(G.demo) - 100);
  }
  drawWorldDrops();
  ctx.restore();

  drawVignette();
  drawGrain();

  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'play') drawPlayHUD();
  else if (G.screen === 'end') drawEnd();
  drawToast();

  if (params.get('debug') === '1') {
    ctx.fillStyle = '#e9ff8a';
    ctx.font = '12px ' + FONT;
    ctx.textAlign = 'left';
    ctx.fillText((G.fps || 0).toFixed(0) + ' fps  ' + G.phase + '  ' + G.screen, 8, H - 12);
  }
}

/* ---------- input ---------- */
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / Math.max(1, r.width)),
    y: (e.clientY - r.top) * (H / Math.max(1, r.height))
  };
}
function activate(id) {
  if (id === 'go-challenge') startMode('challenge', G.dailySeed, { clearGhost: true });
  else if (id === 'go-practice') startMode('challenge', (hashParts('practice', Date.now()) >>> 0) || 1, { clearGhost: true });
  else if (id === 'go-run') startMode('run', (hashParts('run', Date.now(), G.day) >>> 0) || 2, { clearGhost: true });
  else if (id === 'go-zen') startMode('zen', hashParts('zen', G.day, 9) >>> 0, { clearGhost: true });
  else if (id.indexOf('cup-') === 0) {
    G.cup = id.slice(4);
    save('fizz:cup', G.cup);
    tone(880, 0.04, 'triangle', 0.04);
  } else if (id === 'again') restart();
  else if (id === 'menu' || id === 'exit') goTitle();
  else if (id === 'hud') G.hud = !G.hud;
  else if (id === 'share') doShare();
}
function doShare() {
  const text = shareString();
  const done = function (msg) { G.toast = { text: msg, age: 0 }; };
  if (navigator.share) {
    navigator.share({ text: text }).then(function () { done('SHARED'); }).catch(function () { copyText(text).then(function (ok) { done(ok ? 'COPIED' : 'COPY FAILED'); }); });
  } else {
    copyText(text).then(function (ok) { done(ok ? 'COPIED' : 'COPY FAILED'); });
  }
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  unlockAudio();
  const p = pointerPos(e);
  G.fingerX = p.x; G.fingerY = p.y;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const b = hitButton(p.x, p.y);
  if (b) { G.pressed = b.id; return; }
  G.pressed = null;
  if (G.screen === 'play' && G.mode !== 'zen' && (G.phase === 'ready' || G.phase === 'pour')) G.holding = true;
  if (G.screen === 'play' && G.mode === 'zen') G.zenTap = true;
});
canvas.addEventListener('pointermove', function (e) {
  const p = pointerPos(e);
  G.fingerX = p.x; G.fingerY = p.y;
});
function endPointer(e) {
  const p = pointerPos(e);
  const b = hitButton(p.x, p.y);
  if (G.pressed && b && b.id === G.pressed) activate(b.id);
  else if (!G.pressed && G.screen === 'play' && G.phase === 'result' && G.phaseT > 0.32 && G.mode !== 'zen') advance();
  else if (!G.pressed && G.screen === 'play' && G.mode === 'zen' && G.zenTap && !G.hud) G.hud = true;
  G.holding = false;
  G.pressed = null;
  G.zenTap = false;
}
canvas.addEventListener('pointerup', function (e) { e.preventDefault(); unlockAudio(); endPointer(e); });
canvas.addEventListener('pointercancel', function (e) { G.holding = false; G.pressed = null; });
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter') e.preventDefault();
  if (e.repeat) return;
  unlockAudio();
  if (e.code === 'Space') {
    if (G.screen === 'play' && G.mode !== 'zen') G.holding = true;
    else if (G.screen === 'end') restart();
    else if (G.screen === 'title') startMode('challenge', G.dailySeed);
  }
  if (e.code === 'KeyM') goTitle();
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'Space') G.holding = false;
});
window.addEventListener('resize', resize);
document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

/* ---------- boot ---------- */
function boot() {
  buildVolumes();
  G.day = dailyNumber(new Date());
  G.dailySeed = hashParts('fizz-daily-v1', G.day) >>> 0;
  G.seenCoach = !!load('fizz:coached', false);
  const storedCup = load('fizz:cup', 'crystal');
  if (CUPS[storedCup]) G.cup = storedCup;
  const pay = params.get('pay');
  if (pay) {
    const parts = pay.split('|').map(function (s) { return s.trim(); }).filter(Boolean);
    if (parts.length === 3) G.payout = parts;
  }
  const gq = params.get('g');
  if (gq) {
    G.ghost = gq.split(',').map(function (n) { return parseFloat(n); }).filter(function (n) { return !isNaN(n); });
  }
  let seed = null;
  if (params.get('seed')) {
    const raw = params.get('seed');
    seed = /^\d+$/.test(raw) ? (Number(raw) >>> 0) : hashString(raw);
  }
  resize();
  ensureDemo();
  layoutDemo();
  const mode = params.get('mode');
  if (mode === 'zen' || mode === 'run' || mode === 'challenge' || mode === 'daily') {
    const m = mode === 'daily' ? 'challenge' : mode;
    startMode(m, seed == null ? (m === 'challenge' ? G.dailySeed : hashParts(m, G.day)) : seed);
    if (m === 'challenge' && seed != null && seed !== G.dailySeed) G.isDaily = false;
  }
  let last = performance.now();
  let frames = 0, acc = 0;
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;
    frames++; acc += dt;
    if (acc >= 0.4) { G.fps = frames / acc; frames = 0; acc = 0; }
    if (!document.hidden) update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

window.__FIZZ = {
  hold: function () { G.holding = true; if (G.phase === 'ready') beginPour(); },
  release: function () { G.holding = false; },
  arm: function (sec) { G.holding = true; G.arm = sec; if (G.phase === 'ready') beginPour(); },
  start: function (mode, seed) { startMode(mode, seed >>> 0); },
  info: function () {
    const g = G.serve ? storyGlass(G.serve) : null;
    return {
      screen: G.screen, phase: G.phase, mode: G.mode, seed: G.seed, day: G.day,
      index: G.serveIndex, w: W, h: H,
      pct: g ? glassFraction(g) : 0,
      shown: g ? shownPct(glassFraction(g)) : 0,
      pending: g ? g.pending : 0,
      spilled: !!(G.serve && G.serve.glasses.some(function (gl) { return gl.spilled; })),
      results: G.results.map(function (r) { return r.pct; }),
      notes: G.results.map(function (r) { return r.note; }),
      strikes: G.strikes, score: G.runScore, fps: G.fps,
      drink: g ? g.drink.name : '',
      pips: g ? g.pips : 0,
      tower: G.serve && G.serve.glasses.length > 1
    };
  },
  goto: function (index) {
    G.serveIndex = index;
    G.results = G.results.slice(0, index);
    G.serve = buildServe(G.mode, G.seed, index);
    layoutServe(G.serve);
    G.displayPct = 0;
    setPhase('enter');
    return window.__FIZZ.info();
  },
  sim: function (mode, seed, index, seconds) {
    const serve = buildServe(mode, seed >>> 0, index);
    const dt = 1 / 60;
    let t = 0;
    while (t < seconds) { stepServe(serve, dt, true); t += dt; }
    let guard = 0;
    while (serve.glasses.some(function (g) { return g.pending > g.capacity * 0.0035; }) && guard < 400) {
      stepServe(serve, dt, false); guard++;
    }
    return serveSummary(serve);
  },
  state: function () { return G; }
};

boot();
</script>
